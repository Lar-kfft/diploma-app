name: Build and Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE_NAME: gitverse.ru/lar/diploma-app
  K8S_NAMESPACE: default
  K8S_DEPLOYMENT: diploma-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitVerse Registry
        uses: docker/login-action@v3
        with:
          registry: gitverse.ru
          username: ${{ secrets.GITVERSE_USERNAME }}
          password: ${{ secrets.GITVERSE_TOKEN }}

      - name: Prepare image tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          TAGS="${IMAGE_NAME}:${SHA_SHORT}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            TAGS="${TAGS},${IMAGE_NAME}:${TAG_NAME}"
          fi
          TAGS="${TAGS},${IMAGE_NAME}:latest"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${IMAGE_NAME}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy on tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          kubectl -n "${K8S_NAMESPACE}" set image deployment/${K8S_DEPLOYMENT} \
            diploma-app="${IMAGE_NAME}:${TAG_NAME}"
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/${K8S_DEPLOYMENT} --timeout=180s

      - name: Verify deployment
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          kubectl -n "${K8S_NAMESPACE}" get pods -l app=diploma-app -o wide
          kubectl -n "${K8S_NAMESPACE}" get svc diploma-app
